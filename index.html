if(n===11){document.querySelector('#zoom').addEventListener('input',e=>{S.zoom=+e.target.value;updateOcular()});document.querySelector('#astroFocus').addEventListener('input',e=>{S.astroFocus=+e.target.value;updateOcular()});setOcularDrag();updateOcular()}}
function revealRiddle(){if(S.n!==1||S.riddleCount>=4)return;S.riddleCount++;document.querySelectorAll('.riddle-line').forEach((el,i)=>el.classList.toggle('reveal',i<S.riddleCount));const btn=stage.querySelector('[data-act="riddle"]');if(btn)btn.textContent=S.riddleCount===4?'ВІДКРИТИ ВІДГАДКУ ✨':'НАСТУПНИЙ РЯДОК ✨'}
function onAction(a){clickSound();switch(a){case 'next':setScene(S.n+1);break;case 'home':setScene(0);break;case 'riddle':if(S.riddleCount<4)revealRiddle();else if(!S.riddleSolved){S.riddleSolved=true;setScene(1)}else setScene(2);break;case 'playVideo':playVideo();break;case 'microGreen':S.microLeaf='green';setScene(5);break;case 'microYellow':S.microLeaf='yellow';setScene(5);break;case 'mag40':S.magnification=40;setScene(5);break;case 'mag100':S.magnification=100;setScene(5);break;case 'microObserve':S.microObserved=true;modal('ЩО БАЧИМО У МІКРОСКОП?',`<p>Роздивись клітини зеленого й осіннього листка. Які відмінності ти помітив?</p><p><strong>Це збільшені навчальні зображення клітин листка.</strong></p>`,[{text:'ПРОДОВЖИТИ →',fn:()=>setScene(6)}]);break;case 'recordMicro':S.microRecorded=true;modal('📓 ЖУРНАЛ ДОСЛІДНИКА','<p><strong>Наш запис:</strong> улітку листок зелений завдяки хлорофілу. Восени його стає менше, тому помітнішими стають інші кольори.</p>',[{text:'✓ ЗАПИС ЗБЕРЕЖЕНО',fn:()=>setScene(6)}]);break;case 'waterGo':startWater();break;case 'waterAgain':S.waterBusy=false;S.waterItem=null;S.waterSummary='';setScene(7);break;case 'aim':S.skyAimed=false;setScene(10);schedule(()=>{if(S.n!==10)return;S.skyAimed=true;setScene(10)},920);break;case 'openSim':S.skyAimed=true;setScene(11);break;case 'astroCenter':S.panX=0;S.panY=0;S.zoom=1;S.astroFocus=72;updateOcular();document.getElementById('zoom').value='1';document.getElementById('astroFocus').value='72';break;case 'toArt':S.starPhase=0;setScene(12);break;case 'starNext':S.starPhase=(S.starPhase+1)%3;setScene(12);break;case 'print':S.printDone=true;document.querySelector('.craft-print')?.classList.add('visible');stage.querySelector('[data-act="print"]').textContent='ВІДБИТОК ГОТОВИЙ ✓';break;}}
function playVideo(){const v=document.getElementById('lessonVideo');const b=document.getElementById('playVideo');if(!v)return;if(v.paused){v.play().then(()=>b.classList.add('hide')).catch(()=>toast('Не вдалося відтворити відео. Перевір MP4 у репозиторії.'))}else{v.pause();b.classList.remove('hide')}}
function updateMicro(){const im=document.getElementById('microImage');if(!im)return;const zoom=S.magnification===100?1.72:1.02;const blur=Math.abs(S.focus-67)/14;im.style.transform=`scale(${zoom})`;im.style.filter=`blur(${blur.toFixed(2)}px) saturate(1.11)`}
function chooseWater(k){if(S.waterBusy)return;S.waterItem=k;S.waterSummary='';setScene(7)}
function startWater(){if(S.waterBusy)return;if(!S.waterItem){toast('Спочатку обери предмет.');return}const key=S.waterItem;modal('ПЕРЕД ДОСЛІДОМ',`<p>Що станеться, коли <strong>${WATER[key].name.toLowerCase()}</strong> опиниться у воді?</p>`,[{text:'ПЛАВАТИМЕ',fn:()=>runWater(key)},{text:'ПОТОНЕ',fn:()=>runWater(key)}]);}
function runWater(k){if(S.n!==7)return;S.waterBusy=true;const fruit=stage.querySelector('#fruit');if(!fruit){setScene(7);return}fruit.src=path(k);fruit.classList.add('placed');void fruit.offsetWidth;const result=WATER[k].result;schedule(()=>{if(S.n!==7)return;fruit.classList.add(result==='float'?'floating':'sinking');if(k==='leaf')fruit.classList.add('leaffloat');stage.querySelector('#splash')?.classList.add('active')},100);
schedule(()=>{if(S.n!==7)return;S.waterResults[k]=result;S.waterBusy=false;S.waterSummary=WATER[k].explain;setScene(7);const f=document.getElementById('fruit');if(f){f.src=path(k);f.classList.add('placed',result==='float'?'floating':'sinking');if(k==='leaf')f.classList.add('leaffloat')}} ,1680)}
function chooseTarget(k){if(S.n!==11||!TARGETS[k]||S.astroBusy)return;S.astroBusy=true;S.skyTarget=k;S.panX=0;S.panY=0;const frame=document.getElementById('ocular');const im=document.getElementById('ocularImage');const status=document.getElementById('astroStatus');frame?.classList.add('scanning');if(status)status.textContent='Телескоп змінює напрямок і налаштовує поле зору…';schedule(()=>{if(S.n!==11)return;im.src=path(TARGETS[k].file);S.astroBusy=false;frame.classList.remove('scanning');stage.querySelectorAll('[data-target]').forEach(b=>b.classList.toggle('selected',b.dataset.target===k));document.getElementById('ocularCaption').textContent=TARGETS[k].name;status.textContent='Нову ділянку неба знайдено. Наближай і налаштовуй чіткість.';updateOcular()},1280)}
function updateOcular(){const im=document.getElementById('ocularImage');if(!im)return;const blur=Math.abs(S.astroFocus-72)*.16;im.style.transform=`translate(${S.panX}px,${S.panY}px) scale(${S.zoom})`;im.style.filter=`blur(${blur.toFixed(1)}px) contrast(1.14) saturate(1.09)`;const z=document.getElementById('zoomNumber');if(z)z.textContent=`${S.zoom.toFixed(1)}×`}
function setOcularDrag(){const frame=document.getElementById('ocular');if(!frame)return;let down=false,px=0,py=0;frame.addEventListener('pointerdown',e=>{down=true;px=e.clientX;py=e.clientY;try{frame.setPointerCapture(e.pointerId)}catch(_){}});frame.addEventListener('pointermove',e=>{if(!down)return;S.panX=Math.max(-115,Math.min(115,S.panX+e.clientX-px));S.panY=Math.max(-115,Math.min(115,S.panY+e.clientY-py));px=e.clientX;py=e.clientY;updateOcular()});frame.addEventListener('pointerup',()=>down=false);frame.addEventListener('pointercancel',()=>down=false);frame.addEventListener('wheel',e=>{e.preventDefault();S.zoom=Math.min(3.2,Math.max(1,Math.round((S.zoom+(e.deltaY<0?.1:-.1))*10)/10));document.getElementById('zoom').value=String(S.zoom);updateOcular()},{passive:false})}
function reflect(k){const messages={leaf:'Я навчився уважніше розглядати листя та помічати його зміни.',water:'Я побачив, чому одні предмети плавають, а інші тонуть.',stars:'Я навчився знаходити зоряні скупчення й сузір’я Тельця.',craft:'Я використав осінній листок для власної творчої роботи.'};S.reflection=messages[k];document.getElementById('reflectionResult').textContent=S.reflection}
function modal(heading,html,buttons){document.querySelector('.modal-wrap')?.remove();const w=document.createElement('div');w.className='modal-wrap';const panel=document.createElement('div');panel.className='modal-card';const h=document.createElement('h2');h.textContent=heading;panel.append(h);const b=document.createElement('div');b.innerHTML=html;panel.append(b);const acts=document.createElement('div');acts.className='modal-buttons';buttons.forEach(x=>{const e=document.createElement('button');e.className='btn';e.textContent=x.text;e.addEventListener('click',()=>{w.remove();x.fn()});acts.append(e)});const close=document.createElement('button');close.className='btn small';close.textContent='ЗАКРИТИ';close.addEventListener('click',()=>w.remove());acts.append(close);panel.append(acts);w.append(panel);stage.append(w);w.addEventListener('click',e=>{if(e.target===w)w.remove()})}
document.getElementById('back').addEventListener('click',()=>setScene(S.n-1));document.getElementById('next').addEventListener('click',()=>setScene(S.n+1));document.getElementById('home').addEventListener('click',()=>setScene(0));document.getElementById('sound').addEventListener('click',e=>{soundEnabled=!soundEnabled;e.currentTarget.textContent=`♫ Звук: ${soundEnabled?'увімк.':'вимк.'}`;e.currentTarget.setAttribute('aria-pressed',String(soundEnabled))});document.getElementById('fullscreen').addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.getElementById('app').requestFullscreen?.().catch(()=>toast('Повний екран недоступний у цьому браузері.'))});document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea')||stage.querySelector('.modal-wrap'))return;if(e.key==='ArrowRight')setScene(Math.min(names.length-1,S.n+1));if(e.key==='ArrowLeft')setScene(Math.max(0,S.n-1));if(e.key==='Escape'&&document.fullscreenElement)document.exitFullscreen?.()});
setScene(0);
</script>
</body>
</html>
