<style>
:root{--deep:#05266c;--navy:#071d54;--royal:#0759d7;--cyan:#24d9ff;--paper:#fff;--ink:#092c79;--gold:#ffc12e;--glow:0 0 17px #08b8ff93,0 0 32px #0969ff55;--shadow:0 13px 28px #001e65aa;--font:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:radial-gradient(circle at 50% 35%,#1358bc,#041b50 76%);color:#fff;font-family:var(--font);overflow:hidden}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:3px solid #ffd33c;outline-offset:3px}button:disabled{opacity:.35;cursor:not-allowed}.hidden{display:none!important}
#app{height:100dvh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0;position:relative}.stage{position:relative;overflow:hidden;flex:0 1 auto;width:min(100vw,calc((100dvh - 51px) * 16 / 9));aspect-ratio:16/9;isolation:isolate;background:linear-gradient(130deg,#0060d7,#073477);box-shadow:0 0 50px #0006}.stage:after{content:"";position:absolute;inset:0;pointer-events:none;border:1px solid #d5f7ff22;z-index:60}.stage>.scene{position:absolute;inset:0;isolation:isolate;overflow:hidden;animation:sceneIn .48s ease-out both}.bg{position:absolute;inset:0;background-position:center;background-repeat:no-repeat;background-size:cover;z-index:-3}.bg-soft{position:absolute;inset:0;background:linear-gradient(90deg,#082b8c95 0%,#073baf28 57%,#05356b40);z-index:-2;pointer-events:none}.scene::selection{background:#56e0ff;color:#011f52}
@keyframes sceneIn{from{opacity:0;transform:scale(1.012)}to{opacity:1;transform:scale(1)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes flicker{0%,100%{filter:brightness(1)}50%{filter:brightness(1.23)}}@keyframes sparkle{0%,100%{opacity:.4;transform:scale(.85)}50%{opacity:1;transform:scale(1.25)}}@keyframes pulse-ring{0%{box-shadow:0 0 0 0 #28edff80}75%,100%{box-shadow:0 0 0 16px #24ceff00}}@keyframes bloom{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}@keyframes rise{from{opacity:0;transform:translateY(17px)}to{opacity:1;transform:translateY(0)}}@keyframes gentleTurn{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(2deg)}}@keyframes revealLine{to{stroke-dashoffset:0}}
.hud{height:51px;flex:0 0 51px;display:flex;align-items:center;justify-content:space-between;width:min(100vw,calc((100dvh - 51px) * 16 / 9));background:linear-gradient(90deg,#06265f,#073785 54%,#06265f);border-top:1px solid #35ccff75;box-shadow:0 8px 18px #0315389c;padding:0 8px;gap:6px;z-index:100}.hud-grp{display:flex;gap:5px;align-items:center}.hud-btn{background:linear-gradient(180deg,#1477df,#052d89);color:#fff;border:1px solid #63dafe94;border-radius:11px;padding:8px 12px;font-weight:800;font-size:clamp(11px,1vw,14px);box-shadow:inset 0 2px 3px #b2edff42,0 3px 8px #02163a;white-space:nowrap;transition:transform .14s,filter .14s}.hud-btn:hover:not(:disabled){filter:brightness(1.26);transform:translateY(-2px)}.hud-btn:active:not(:disabled){transform:translateY(2px)}.hud-btn.on{background:linear-gradient(#12a9d0,#07438f)}.hud-label{color:#cdeaff;font-size:clamp(10px,.9vw,13px);font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.progress{font-size:12px;letter-spacing:.06em;color:#b9eaff;white-space:nowrap;font-variant-numeric:tabular-nums}
.headline3d{color:#fff;font-weight:1000;letter-spacing:.035em;line-height:1.07;-webkit-text-stroke:1px #b2f5ff;text-shadow:0 2px 0 #6de9ff,0 5px 0 #1575e0,0 8px 0 #05319b,0 13px 12px #00286fa8,0 0 32px #43bcff81}.title-lg{font-size:clamp(24px,4.6vw,76px)}.title-md{font-size:clamp(20px,3.35vw,58px)}.scene-title{position:absolute;top:3%;left:4%;font-size:clamp(19px,3vw,45px);margin:0;line-height:1.12;z-index:2}.subtitle{font-size:clamp(13px,1.5vw,24px);font-weight:700}.glass{background:linear-gradient(135deg,#061c60e9,#073e9ce6);border:1.5px solid #6be9ffcc;border-radius:20px;box-shadow:0 12px 35px #021c64b5,0 0 25px #0279d98a,inset 0 2px 4px #b7fbff42;backdrop-filter:blur(9px)}.whiteglass{background:linear-gradient(155deg,#fff 0%,#eefaff 66%,#d6eaff 100%);color:var(--ink);border:2px solid #80d9ff;border-radius:18px;box-shadow:0 10px 30px #03245b99,inset 0 3px 6px #fff}.mainbtn,.minorbtn,.goldbtn,.greenbtn{border:1.6px solid #b4faff;box-shadow:0 7px 0 #03236c,0 10px 24px #001c629a,inset 0 3px 4px #ffffffc0,0 0 17px #05bcff80;border-radius:16px;font-weight:900;line-height:1.12;letter-spacing:.02em;text-shadow:0 1px 3px #002968;transition:transform .17s,filter .17s,box-shadow .17s;color:white;background:linear-gradient(180deg,#43f2ff 0%,#009df7 30%,#0052d9 86%,#00399a 100%)}.mainbtn{font-size:clamp(12px,1.6vw,23px);padding:clamp(9px,1.1vw,18px) clamp(12px,2vw,30px)}.minorbtn{font-size:clamp(11px,1.07vw,18px);padding:clamp(7px,.8vw,13px) clamp(10px,1.1vw,18px);border-radius:13px}.goldbtn{background:linear-gradient(#ffea67,#ff9b08 54%,#b94e06);border-color:#fff4a8}.greenbtn{background:linear-gradient(#93ffb4,#13ce74 45%,#008b47);border-color:#baffdc}.mainbtn:hover:not(:disabled),.minorbtn:hover:not(:disabled),.goldbtn:hover:not(:disabled),.greenbtn:hover:not(:disabled){transform:translateY(-4px) scale(1.025);filter:brightness(1.13);box-shadow:0 11px 0 #02256b,0 13px 27px #01143da8,inset 0 3px 6px #fff8,0 0 29px #1cf9ff}.mainbtn:active,.minorbtn:active,.goldbtn:active,.greenbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #082f76,inset 0 2px 6px #001b6b88}
.content-pad{position:absolute;inset:0;padding:4%}.tag{display:inline-block;border-radius:999px;padding:.35em .9em;background:linear-gradient(100deg,#05adfb,#064fae);border:1px solid #85f4ff;font-weight:900;text-shadow:0 1px 4px #032666;box-shadow:0 4px 15px #003e9999}.asset-img{display:block;object-fit:contain;max-width:100%;max-height:100%;user-select:none;-webkit-user-drag:none}.abs{position:absolute}.controlbox{padding:15px 20px}.light-panel{background:#fff;box-shadow:0 13px 32px #004fa667;border:2px solid #2bd1ff;border-radius:22px;color:#073474}.small{font-size:clamp(11px,1.1vw,17px)}.large{font-size:clamp(15px,1.9vw,30px)}.explain{line-height:1.45;font-size:clamp(13px,1.55vw,24px)}.hint{font-weight:650;font-size:clamp(12px,1.14vw,18px);color:#e2f6ff}.floating{animation:float 4s ease-in-out infinite}.safeshade{background:linear-gradient(100deg,#073b92ef,#0749b4a3);box-shadow:0 9px 35px #002a7c8a;border-radius:24px;border:1.5px solid #29caff9c}.screen-poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}

.hero-title{position:absolute;left:3.1%;top:17%;width:42%;max-height:35%;filter:drop-shadow(0 8px 7px #002e6d85)}.hero-title.fallback{font-size:clamp(20px,3.5vw,61px)}.hero-start{position:absolute;left:6.5%;top:55%;z-index:4}.hero-hit{position:absolute;bottom:6.0%;height:18.5%;width:23.2%;border:2px solid transparent;border-radius:28px;background:transparent;z-index:4;transition:all .18s}.hero-hit:hover,.hero-hit:focus-visible{box-shadow:inset 0 0 0 3px #ffffffa1,0 0 31px #31e2ffa8;transform:translateY(-4px)}.hero-hit:active{transform:translateY(2px)}

.riddle-body{position:absolute;left:12%;top:28%;width:47%;display:flex;flex-direction:column;align-items:flex-start;gap:1.6vw}.riddle-poem{font-size:clamp(18px,2.45vw,42px);font-weight:850;line-height:1.39;text-shadow:0 3px 9px #00276b,0 1px 2px #002253;white-space:nowrap}.riddle-answer{font-size:clamp(39px,6.6vw,104px);animation:bloom .5s ease-out both;margin-top:.2em}.riddle-body .mainbtn{margin-left:2%}
/* Media */
.video-card{position:absolute;left:17%;top:11%;width:66%;height:76%;border-radius:24px;overflow:hidden;background:#062c80;border:3px solid #8ef4ff;box-shadow:0 0 46px #58b9ff91,0 25px 50px #001a4fbb}.video-card video{width:100%;height:100%;object-fit:contain;display:block;background:#030f37}.video-button{position:absolute;left:50%;top:51%;transform:translate(-50%,-50%);z-index:5}.video-button:hover{transform:translate(-50%,-55%) scale(1.05)!important}.video-caption{position:absolute;top:2%;left:4%;right:4%;text-align:center;font-weight:950;font-size:clamp(19px,3vw,44px)}
/* Microscope */
.lab-bg{background-image:linear-gradient(110deg,#024fa4ad,#0871be2c),url('./water_autumn_background.png')}.micro-intro-photo{position:absolute;left:2%;top:17%;width:46%;height:73%;object-fit:contain;filter:drop-shadow(0 16px 25px #00276d)}.micro-card{position:absolute;left:47%;top:19%;width:47%;padding:3%;background:linear-gradient(160deg,#053880ee,#0658bde7);border:2px solid #86f4ff;border-radius:26px;box-shadow:0 14px 40px #00265eab}.micro-card h2{font-size:clamp(22px,3.3vw,53px);line-height:1.12;margin:4% 0;color:#fff}.micro-card p{font-size:clamp(15px,1.65vw,25px);line-height:1.47}
.microscope-workspace{position:absolute;inset:14% 2% 6%;display:grid;grid-template-columns:36% 39% 23%;gap:1%}.micro-device{position:relative;align-self:stretch;display:flex;align-items:center;justify-content:center}.micro-device img{width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 14px 20px #00245684)}.micro-lens-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2%;height:100%}.micro-lens{width:min(100%,64vh);aspect-ratio:1/1;max-height:77%;border-radius:50%;border:clamp(7px,1.3vw,18px) solid #bdeaff;box-shadow:0 0 0 5px #0459c5,0 0 28px #16dcff,0 10px 27px #082968b8,inset 0 0 16px #001e55;position:relative;overflow:hidden;background:#cfff8f}.micro-lens .micro-pattern{position:absolute;inset:-40%;background-position:center;background-size:330% auto;background-position:64% 12%;background-repeat:no-repeat;transition:filter .45s,transform .45s,background-image .25s}.micro-focus-glass{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 25% 18%,#ffffff6a,transparent 25%),linear-gradient(125deg,#fff3,transparent 40%)}.micro-actions{height:100%;padding:4%;display:flex;flex-direction:column;gap:3%;justify-content:center}.micro-actions .minorbtn{width:100%;font-size:clamp(11px,1.23vw,21px);text-align:left}.micro-actions .minorbtn.selected{background:linear-gradient(#36f7ff,#056ac9);box-shadow:0 0 20px #33e8ff,0 6px 0 #06348b}.range-label{font-weight:850;font-size:clamp(12px,1.2vw,20px)}input[type=range]{width:100%;accent-color:#17dffb;cursor:pointer}.micro-observation{font-size:clamp(13px,1.3vw,20px);line-height:1.35;padding:3%}.micro-mini{max-height:28%;width:100%;object-fit:cover;border-radius:11px;border:2px solid #72edff}
/* Water: panel from approved artwork, hit zones and journal live overlay */
.water-bg{background-image:url('./water_autumn_background.png')}.water-head{top:2%;left:34%;right:24%;text-align:center;font-size:clamp(19px,2.7vw,46px)}.water-panel{position:absolute;left:0;top:11%;width:32%;height:78%;object-fit:contain;object-position:top center;filter:drop-shadow(0 5px 14px #001f60a0)}.water-hitbox{position:absolute;left:6%;width:21%;height:8%;border-radius:20px;border:2px solid transparent;background:transparent;z-index:7;transition:.18s}.water-hitbox:hover,.water-hitbox.active{border-color:#93faff;box-shadow:0 0 22px #27eaff, inset 0 0 15px #20f8ff4d;transform:translateX(3px)}.water-hitbox:focus-visible{outline:3px solid yellow}.tank-area{position:absolute;left:31%;top:30%;width:44%;height:47%;z-index:2}.tank-img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;filter:drop-shadow(0 9px 18px #003d86a8);z-index:2;pointer-events:none;opacity:.92}.tank-area:after{content:"";position:absolute;left:8%;right:8%;top:33%;height:51%;border-radius:12% 12% 33% 33%;background:linear-gradient(180deg,#a3faff22,#00a3ec1e 56%,#41d4fb3b);z-index:4;pointer-events:none;mix-blend-mode:screen}.water-object{position:absolute;z-index:3;width:16%;height:29%;object-fit:contain;opacity:0;left:40%;top:-18%;filter:drop-shadow(0 8px 4px #07386b88)}.water-object.entry{opacity:1;animation:objectDrop 1.35s cubic-bezier(.24,.65,.29,1) forwards}.water-object.floating-result{opacity:1;top:24%;animation:bob 2.3s ease-in-out infinite}.water-object.sunk-result{opacity:1;top:64%;transform:rotate(16deg)}.water-object.tiny{width:15%;height:21%}.splash{position:absolute;left:36%;top:27%;width:26%;height:10%;border:4px solid #c3fbff;z-index:4;border-radius:50%;box-shadow:0 0 24px #72f4ff;opacity:0;pointer-events:none}.splash.play{animation:splash .7s ease-out .6s}.water-experiment-ops{position:absolute;left:32%;bottom:5%;width:43%;display:flex;justify-content:center;gap:2.2%;flex-wrap:wrap;z-index:8}.water-topnote{position:absolute;left:32%;top:15%;width:43%;min-height:1 @keyframes objectDrop{0%{top:-22%;transform:rotate(-23deg);opacity:1}70%{top:52%;transform:rotate(11deg);opacity:1}100%{top:var(--rest,24%);transform:rotate(var(--tilt,0deg));opacity:1}}@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(6px) rotate(2deg)}}@keyframes splash{0%{opacity:0;transform:scale(.15)}30%{opacity:1}100%{opacity:0;transform:scale(1.8)}}
/* Stars / sky */
.sky-heading{position:absolute;left:5%;top:12%;width:60%;padding:3%;background:linear-gradient(90deg,#00276fac,#00358145);border-radius:24px}.sky-heading h2{font-size:clamp(28px,4.1vw,67px);line-height:1.1;margin:0 0 3%}.sky-heading p{font-size:clamp(16px,1.8vw,28px);line-height:1.45;font-weight:800}.observatory-ui{position:absolute;top:15%;right:4%;width:32%;padding:2.3%;z-index:5}.telescope-overlay{position:absolute;left:7%;bottom:9%;width:47%;height:74%;object-fit:contain;filter:drop-shadow(0 20px 26px #011d5fa8);transform-origin:44% 76%;transition:transform 1.2s ease}.telescope-overlay.aim{transform:translateX(2%) rotate(-8deg)}.eyepiece-circle{position:absolute;right:7%;top:18%;width:35%;aspect-ratio:1/1;border:clamp(7px,1.2vw,17px) solid #d7f8ff;border-radius:50%;box-shadow:0 0 0 6px #046ccf,0 0 30px #1adaff,0 15px 35px #01266b;overflow:hidden;background:#061a40;z-index:4}.eyepiece-circle img{width:100%;height:100%;object-fit:cover;transition:filter 1.1s,transform 1.1s}.eyepiece-label{position:absolute;right:6%;bottom:9%;width:36%;text-align:center;font-weight:900;font-size:clamp(12px,1.34vw,22px)}
.star-chart{position:absolute;inset:3.5% 3% 8%;border-radius:24px;overflow:hidden;border:1px solid #54bdff5c;background:radial-gradient(ellipse at 65% 27%,#2151a27c,#051641e8 68%),url('./november_sky_background.png') center/cover}.star-chart:before{content:"";position:absolute;inset:0;background:#03173ea8}.star-chart svg{width:100%;height:100%;position:absolute;inset:0}.constellation-line{fill:none;stroke:#5fe9ff;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px #3cdeff);stroke-dasharray:1200;stroke-dashoffset:1200;transition:stroke-dashoffset 1.6s ease}.constellation-line.visible{stroke-dashoffset:0}.astro-dot{filter:drop-shadow(0 0 8px #a9e5ff)}.astro-label{font-size:clamp(12px,1.16vw,20px);font-weight:900;fill:#faffff;paint-order:stroke;stroke:#061c5e;stroke-width:4;stroke-linejoin:round;opacity:0;transition:opacity .45s}.astro-label.visible{opacity:1}.bull-interpretation{opacity:0;transition:opacity 1.3s;pointer-events:none;fill:none;stroke:#ffd77d;stroke-width:3;stroke-linejoin:round;stroke-dasharray:8 10;filter:drop-shadow(0 0 8px #fcac38)}.bull-interpretation.visible{opacity:.7}.stars-overlay-caption{position:absolute;left:5%;bottom:5%;z-index:5;background:#052b83ed;border:1px solid #63d9ff;padding:1% 2%;border-radius:14px;font-size:clamp(12px,1.05vw,18px);font-weight:700;max-width:62%}.star-controls{position:absolute;top:2%;right:3%;z-index:9;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;max-width:55%}
/* Craft & finale */
.craft-poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.craft-card{position:absolute;left:6%;top:13%;width:64%;height:70%;object-fit:contain;filter:drop-shadow(0 12px 20px #041b55)}.craft-check{position:absolute;right:4%;top:24%;max-width:28%}.craft-float{position:absolute;right:4%;top:35%;width:28%;padding:2.3%;text-align:center}.leaf-paper{position:absolute;right:5%;top:18%;width:48%;height:65%;background:#fff;border:2px solid #72dfff;box-shadow:0 18px 32px #00205e99,inset 0 0 25px #bdefff;border-radius:15px;transform:rotate(-1deg)}.print-leaf{position:absolute;left:15%;top:10%;width:67%;height:78%;object-fit:contain;opacity:0;filter:grayscale(1) sepia(1) saturate(8) hue-rotate(315deg) brightness(.76) contrast(1.4);transform:scale(.78) rotate(9deg);transition:opacity .9s,transform 1.1s}.print-leaf.visible{opacity:.66;transform:scale(1.03) rotate(9deg)}.leaf-source{position:absolute;left:8%;top:30%;height:43%;width:32%;object-fit:contain;filter:drop-shadow(0 13px 18px #022760);animation:gentleTurn 4s ease-in-out infinite}.final-reflection{position:absolute;left:9%;right:9%;top:22%;height:63%;padding:3.5%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5%;text-align:center}.reflection-q{font-size:clamp(25px,3.7vw,64px);font-weight:950;line-height:1.14}.reflection-caption{font-size:clamp(15px,1.7vw,27px);line-height:1.4;font-weight:650}
/* shared modal */
.modal-shade{position:absolute;inset:0;background:#001b58a9;display:flex;align-items:center;justify-content:center;z-index:80;backdrop-filter:blur(4px)}.modal-body{max-height:88%;overflow:auto;min-width:min(500px,85%);max-width:75%;padding:3.2%;border-radius:24px;background:linear-gradient(145deg,#fff,#e4f7ff);color:#053777;border:3px solid #2bdcff;box-shadow:0 18px 60px #001d60eb,0 0 30px #18dfff}.modal-body h2{margin:0 0 10px;font-size:clamp(24px,3vw,47px)}.modal-body p{font-size:clamp(15px,1.45vw,23px);line-height:1.4}.modal-actions{display:flex;gap:15px;justify-content:center;flex-wrap:wrap;margin-top:3%}.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);z-index:300;padding:10px 18px;border-radius:12px;background:#fff;color:#064184;box-shadow:0 8px 40px #041345ae;font-weight:800;font-size:14px;max-width:90vw;text-align:center}.teacher-note{position:absolute;bottom:2%;right:2%;padding:.45% .85%;background:#062b7bcb;border:1px solid #73d7ff75;border-radius:12px;font-weight:700;font-size:clamp(10px,.83vw,14px);max-width:47%}
@media(max-width:900px){.hud-btn{padding:7px 8px}.hud-label{display:none}.water-head{top:1%}.journal-summary{font-size:8px}.micro-actions .minorbtn{padding:4px 5px}.small{font-size:11px}}
@media(max-width:680px){.hud{height:45px;flex-basis:45px}.hud-btn{font-size:11px;padding:7px 6px}.stage{width:min(100vw,calc((100dvh - 45px)*16/9))}.progress{font-size:10px}.mainbtn{border-radius:8px}.riddle-poem{font-size:clamp(14px,2.2vw,25px)}.glass,.whiteglass{border-radius:9px}.water-hitbox{border-radius:6px}}

/* Digital telescope preview: immersive, unobstructed eyepiece */
.digital-sky{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 52% 48%,#12356f 0%,#071c46 50%,#020918 100%);color:white}
.digital-sky:before{content:"";position:absolute;inset:-6%;pointer-events:none;background-image:radial-gradient(circle,#dff7ff 1px,transparent 1.5px),radial-gradient(circle,#70b5ff 1px,transparent 1.5px);background-size:87px 83px,133px 119px;background-position:12px 22px,35px 52px;opacity:.43;animation:skyDrift 26s ease-in-out infinite alternate}

/* Calibration repair: controls in their own columns, not guessed hotspots over artwork. */
.video-stage{position:absolute;inset:0;background:#061836;overflow:hidden}.video-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#061836}.video-play-shell{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:6}.video-bottom-caption{position:absolute;bottom:3%;left:12%;right:12%;text-align:center;padding:1.2%;border-radius:18px;background:#052d77bd;color:#fff;font-weight:900;font-size:clamp(16px,2vw,31px);text-shadow:0 2px 5px #001e4d;pointer-events:none}

.water-head{left:28%;right:3%;top:3%}.tank-area{left:29%;top:30%;width:44%;height:52%}.water-topnote{left:29%;top:17%;width:44%;min-height:8%}.water-experiment-ops{left:29%;bottom:3%;width:44%}.journal-toggle{right:2%;top:19%;width:22%;z-index:8}.water-tip{left:74%;top:32%;bottom:auto;width:24%;max-height:51%;overflow:auto;z-index:7;font-size:clamp(12px,1.15vw,19px);line-height:1.35;padding:1.2%}.water-object.floating-result{animation:leafWaterFloat 3.2s ease-in-out infinite}.water-object.sunk-result{animation:none}.water-object.entry{animation:objectDropCalibrated 1.55s ease-out forwards}
@keyframes objectDropCalibrated{0%{top:-18%;opacity:1;transform:rotate(-8deg)}100%{top:var(--rest,24%);opacity:1;transform:rotate(var(--tilt,0deg))}}

.reflect-card span{font-size:clamp(13px,1.36vw,22px);font-weight:950;line-height:1.17}.reflect-card small{font-size:clamp(11px,1.12vw,18px);font-weight:680;color:#e4f8ff;line-height:1.2}.reflect-card:hover{transform:translateY(-5px);filter:brightness(1.18)}

.magic-orbs{position:absolute;inset:0;z-index:2;pointer-events:none}.magic-orbs i{display:block;position:absolute;width:clamp(7px,.9vw,15px);height:clamp(7px,.9vw,15px);background:#fff7bd;border-radius:50%;box-shadow:0 0 11px 5px #fffbc6c9,0 0 28px 12px #1fe7ff6e;animation:orbMagic 5s ease-in-out infinite}.magic-orbs i:nth-child(1){left:45%;top:18%}.magic-orbs i:nth-child(2){left:80%;top:22%;animation-delay:-1s}.magic-orbs i:nth-child(3){left:60%;top:72%;animation-delay:-2.4s}.magic-orbs i:nth-child(4){left:18%;top:58%;animation-delay:-1.6s}.magic-orbs i:nth-child(5){left:72%;top:45%;animation-delay:-3.4s}.magic-orbs i:nth-child(6){left:38%;top:80%;animation-delay:-3.8s}

<body>
<div id="app"><main id="stage" class="stage" role="main" aria-live="polite"></main><nav class="hud" aria-label="Керування уроком"><div class="hud-grp"><button id="home" class="hud-btn" title="На початок (Home)">⌂ Початок</button><button id="back" class="hud-btn" title="Попередня сцена (←)">← Назад</button><button id="next" class="hud-btn" title="Наступна сцена (→)">Далі →</button></div><span class="hud-label" id="sceneName">ДЕНЬ ТВОРЧОСТІ ТА ІННОВАЦІЙ</span><div class="hud-grp"><button id="sound" class="hud-btn" title="Звуки інтерфейсу">♫ Звук: вимк.</button><button id="fullscreen" class="hud-btn" title="Повний екран">⛶ Екран</button><span class="progress" id="counter">01 / 14</span></div></nav></div>
<script>
'use strict';
/* SINGLE-FILE GITHUB PAGES EDITION. Put index.html and all 26 assets in the SAME repository directory. */
const A={
 hero:'hero_background.png',title:'title_3d.png',riddle:'riddle_background.png',autumnVideo:'autumn_intro_silent.mp4',leafVideo:'leaf_talking.mp4',
 microGreenLens:'micro_leaf_green_lens.png',microYellowLens:'micro_leaf_yellow_lens.png',microMain:'microscope_main.png',micro1:'microscope_01_overview.png',micro2:'microscope_02_select_leaf.png',micro3:'microscope_03_compare_leaves.png',micro4:'microscope_04_discovery.png',
 waterBG:'water_autumn_background.png',tank:'water_tank.png',apple:'water_apple.png',pear:'water_pear.png',plum:'water_plum.png',leaf:'water_leaf.png',stone:'water_stone.png',selectPanel:'water_selection_panel.png',journal:'water_journal_frame.png',
 skyBG:'november_sky_background.png',observatoryBG:'observatory_research_background.png',telescope:'telescope_main.png',eyepiece:'telescope_eyepiece_view.png',
 taurusRoom:'taurus_room_intro.png',taurusCard:'taurus_punch_card.png',taurusCheck:'taurus_punch_card_teacher_check.png'
};
const file=k=>'./'+A[k];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stage=document.getElementById('stage');let scene=0,soundOn=false,audioCtx=null,uiTimeout=null;
const names=['Титульна сцена','Осіння загадка','Заставка після загадки','Знайомство з Листочком','Перший погляд у мікроскоп','Таємниця листочка','Наше відкриття','Осінні дари у воді','Листопадове небо','Віртуальна обсерваторія','Знайомство із Тельцем','Сузір’я у твоїй кімнаті','Картка сузір’я Тельця','Творча майстерня','Наші відкриття'];
const state={riddle:false,microRecorded:false,reflectionChoice:null,paintColor:'orange',focus:60,microLeaf:'green',mag:40,microSeen:false,waterSelection:null,waterResults:{},waterBusy:false,waterPrediction:null,journalOpen:false,skyAim:false,skyFocus:false,skyZoom:1,skyFocusLevel:82,skyTarget:'pleiades',starStep:0,printed:false,reflection:false};
function clickSound(){if(!soundOn)return;try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.setValueAtTime(680,audioCtx.currentTime);osc.frequency.exponentialRampToValueAtTime(510,audioCtx.currentTime+.1);gain.gain.setValueAtTime(.045,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.12);osc.connect(gain).connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+.12)}catch(e){}}
function toast(t){let old=document.querySelector('.toast');if(old)old.remove();const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);clearTimeout(uiTimeout);uiTimeout=setTimeout(()=>d.remove(),3600)}
function assetImg(k,cls='',more=''){return `<img src="${file(k)}" class="${cls}" alt="" draggable="false" ${more}>`}
function setScene(n){if(n<0||n>=names.length)return;const v=stage.querySelector('video');if(v)v.pause();scene=n;document.querySelector('#sceneName').textContent=names[n];document.querySelector('#counter').textContent=String(n+1).padStart(2,'0')+' / '+String(names.length).padStart(2,'0');document.querySelector('#back').disabled=n===0;document.querySelector('#next').disabled=n===names.length-1;stage.innerHTML=`<section class="scene" aria-label="${esc(names[n])}">${renderScene(n)}</section>`;bindScene(n);clickSound()}
function change(delta){setScene(scene+delta)}
const title=(txt,small='')=>`<h1 class="scene-title headline3d">${txt}</h1>${small?`<span class="tag abs" style="top:11%;left:4%">${small}</span>`:''}`;
function renderScene(n){switch(n){
case 0:return `<div class="bg" style="background-image:url('${file('hero')}')"></div><div class="magic-orbs" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div><img src="${file('title')}" class="hero-title" alt="ДЕНЬ ТВОРЧОСТІ ТА ІННОВАЦІЙ"><button class="mainbtn hero-start" data-act="start">РОЗПОЧАТИ ДОСЛІДЖЕННЯ ➜</button>${[0,1,2,3].map((i)=>`<button class="hero-hit" style="left:${2.3+i*24.5}%" data-act="hero${i}" aria-label="${['Досліджуємо','Малюємо','Конструюємо','Створюємо'][i]}"></button>`).join('')}<div class="teacher-note">Урок-дослідження • 3 клас • керування тільки вчителем</div>`;
case 1:return `<div class="bg" style="background-image:url('${file('riddle')}')"></div><div class="riddle-body"><div class="riddle-poem">В жовте лист пофарбувала,<br>Урожай з полів зібрала.<br>Золотила вербам коси<br>Чарівна цариця — …</div>${state.riddle?`<div class="riddle-answer headline3d">ОСІНЬ</div><button class="mainbtn" data-act="next">ВІДКРИТИ ОСІННЮ ПРИГОДУ →</button>`:`<button class="mainbtn" data-act="riddle">ПОКАЗАТИ ВІДГАДКУ ✨</button>`}</div><div class="teacher-note">Відгадка відкриється лише після натискання</div>`;
case 2:return videoScene('autumnVideo','ОСІНЬ ВІДКРИВАЄ СВОЇ ТАЄМНИЦІ','Беззвучна заставка • натисни «Відтворити»',true);
case 3:return videoScene('leafVideo','ЛИСТОЧОК ЗАПРОШУЄ ДОСЛІДЖУВАТИ','Відео з оригінальним голосом Листочка',false);
case 4:return `<div class="bg lab-bg"></div>${title('ТАЄМНИЦЯ ОСІННЬОГО ЛИСТОЧКА')}${assetImg('microMain','micro-intro-photo')}<div class="micro-card"><span class="tag">ПЕРШЕ ВІДКРИТТЯ</span><h2>Чому листок змінює колір?</h2><p>Зелений навесні й улітку — жовтий восени. Що приховує його будова?</p><button data-act="next" class="mainbtn">ДО МІКРОСКОПА 🔬</button></div>`;
case 5:return microscopeScene();
case 6:return `<div class="bg" style="background-image:url('${file('micro4')}')"></div><div class="bg-soft" style="background:linear-gradient(90deg,#08296ce8 0%,#082c6699 40%,transparent 72%)"></div><div class="abs glass" style="left:2.5%;top:19%;width:40%;padding:2.5%;line-height:1.4"><span class="tag">НАУКОВЕ ПОЯСНЕННЯ</span><h2 style="font-size:clamp(22px,2.75vw,46px);margin:5% 0">Звідки береться жовтий колір?</h2><p class="explain">У зеленому листку є хлорофіл. Восени його стає менше, і ми починаємо краще бачити жовті та помаранчеві пігменти, які були там раніше.</p><button class="greenbtn minorbtn" data-act="microRecord">${state.microRecorded?'✓ ЗАПИСАНО ДО ЖУРНАЛУ':'✦ ЗАПИСАТИ ВІДКРИТТЯ'}</button>${state.microRecorded?'<div class="whiteglass" style="margin-top:3%;padding:3%;font-size:clamp(13px,1.5vw,22px);line-height:1.3">📓 ЖУРНАЛ: У жовтому листку хлорофілу менше; жовті пігменти стали помітними.</div>':''}</div>`;
case 7:return waterScene();
case 8:return `<div class="bg" style="background-image:url('${file('skyBG')}')"></div><div class="sky-heading"><span class="tag">ОСТАННІЙ МІСЯЦЬ ОСЕНІ</span><h2 class="headline3d" style="margin-top:4%">ЛИСТОПАДОВЕ НЕБО</h2><p>Дні коротшають, вечори стають довшими. У цей час вечірнє небо відкриває нам сузір’я Тельця — з яскравим Альдебараном і Плеядами.</p><button class="mainbtn" data-act="next">ДО ОБСЕРВАТОРІЇ ✦</button></div>`;
case 9:return observatoryScene();

function bindScene(n){const s=stage.querySelector('.scene');s.addEventListener('click',onStageClick);if(n===5){const r=s.querySelector('#focusRange');r.addEventListener('input',e=>{state.focus=Number(e.target.value);updateMicro()})}if(n===7){showWaterSelection();updateJournal()}if(n===5)setSharpMicroImage();if(n===13){const l=stage.querySelector('.print-leaf');if(l)l.style.filter=paintFilters[state.paintColor];stage.querySelectorAll('[data-paint]').forEach(b=>b.classList.toggle('active',b.dataset.paint===state.paintColor))}if(n===10&&state.starStep>=2){requestAnimationFrame(()=>{if(scene!==10)return;stage.querySelectorAll('.constellation-line').forEach(el=>el.classList.add('visible'));if(state.starStep>=3)stage.querySelectorAll('.astro-label').forEach(el=>el.classList.add('visible'));if(state.starStep>=4)stage.querySelector('.bull-interpretation')?.classList.add('visible')})}if(n===9&&state.skyFocus){const focus=s.querySelector('#skyFocusRange');if(focus)focus.addEventListener('input',e=>{state.skyFocusLevel=Math.max(0,Math.min(100,Number(e.target.value)||0));updateDigitalTelescope()})}}
function onStageClick(e){const paint=e.target.closest('[data-paint]');if(paint){state.paintColor=paint.dataset.paint;const leaf=document.querySelector('.print-leaf');if(leaf)leaf.style.filter=paintFilters[state.paintColor];document.querySelectorAll('[data-paint]').forEach(b=>b.classList.toggle('active',b.dataset.paint===state.paintColor));return}const itemBtn=e.target.closest('[data-item]');if(itemBtn){selectWater(itemBtn.dataset.item);return}const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act;clickSound();switch(act){case 'start':state.riddle=false;state.reflectionChoice=null;setScene(1);break;case 'next':change(1);break;case 'home':state.riddle=false;setScene(0);break;case 'hero0':setScene(1);break;case 'hero1':setScene(13);break;case 'hero2':setScene(11);break;case 'hero3':setScene(13);break;case 'riddle':state.riddle=true;setScene(1);break;case 'playVideo':{let v=document.querySelector('#lessonVideo');if(!v)return;if(v.paused){v.play().then(()=>{document.querySelector('#videoPlay').classList.add('hidden')}).catch(()=>toast('Відео не відтворилося. Перевір назву MP4 та завантаження в GitHub.'))}else v.pause();v.onended=()=>{let b=document.querySelector('#videoPlay');if(b){b.textContent='▶ ВІДТВОРИТИ ЩЕ РАЗ';b.classList.remove('hidden')}};v.onclick=()=>{if(!v.paused)v.pause();else v.play().catch(()=>{});document.querySelector('#videoPlay').classList.toggle('hidden',!v.paused)};break}
case 'microGreen':state.microLeaf='green';updateMicro();break;case 'microYellow':state.microLeaf='yellow';updateMicro();break;case 'mag40':state.mag=40;updateMicro();break;case 'mag100':state.mag=100;updateMicro();break;case 'microCompare':modal('ПОРІВНЯЙ ЛИСТКИ',`<img src="${file('micro3')}" style="width:min(68vw,660px);max-height:43vh;object-fit:contain;border-radius:12px" alt="Порівняння"/><p>Що змінилося? Зверни увагу на зелений хлорофіл та появу осінніх кольорів. Зображення — навчальна ілюстрація.</p>`,[{text:'ЗРОБИТИ ВІДКРИТТЯ →',fn:()=>setScene(6)}]);break;case 'microRecord':state.microRecorded=true;setScene(6);modal('НАШЕ ПЕРШЕ ВІДКРИТТЯ','<p>Листок здається зеленим завдяки хлорофілу. Восени зеленого пігменту стає менше, тому помітнішими стають жовті й помаранчеві кольори.</p>',[{text:'ЗАПИСАНО ✓',fn:()=>toast('Перше відкриття збережено в нашій уявній лабораторії.') }]);break;
case 'waterConclusion':modal('НАШЕ ВІДКРИТТЯ','<div class="water-conclusion"><img src="./water_apple.png" alt="Яблуко"><div><b>Чому яблуко плаває?</b><p>У м’якоті є проміжки з повітрям. Тому яблуко зазвичай легше, ніж такий самий об’єм води.</p></div><img src="./water_stone.png" alt="Камінець"><div><b>Чому камінчик тоне?</b><p>Звичайний щільний камінь важчий, ніж такий самий об’єм води. Він опускається на дно.</p></div></div><p><b>Висновок:</b> Важливі матеріал і об’єм предмета, а не лише його вага.</p>',[{text:'ПЕРЕГЛЯНУТИ ЖУРНАЛ',fn:()=>openWaterJournal()}]);break;case 'waterStart':startWater();break;case 'waterReset':resetWater();break;case 'journal':openWaterJournal();break;
case 'skyAim':state.skyAim=!state.skyAim;state.skyFocus=false;setScene(9);break;case 'skyLook':state.skyFocus=true;state.skyZoom=1;state.skyFocusLevel=82;state.skyTarget='pleiades';setScene(9);break;case 'skyExit':state.skyFocus=false;setScene(9);break;case 'skyZoomIn':state.skyZoom=Math.min(2.5,+(state.skyZoom+.25).toFixed(2));updateDigitalTelescope();break;case 'skyZoomOut':state.skyZoom=Math.max(1,+(state.skyZoom-.25).toFixed(2));updateDigitalTelescope();break;case 'skyPleiades':state.skyTarget='pleiades';setScene(9);break;case 'skyAldebaran':state.skyTarget='aldebaran';setScene(9);break;case 'starsGo':setScene(10);break;case 'starsAdvance':state.starStep=Math.min(4,state.starStep+1);setScene(10);break;case 'starsReset':state.starStep=0;setScene(10);break;case 'leafPrint':state.printed=true;document.querySelector('.print-leaf')?.classList.add('visible');toast('Ось відбиток! Прожилки листка залишили свій слід.');break;case 'reflectionPrompt':state.reflectionChoice=el.dataset.prompt||'Яке відкриття сподобалося тобі найбільше?';setScene(14);break;case 'showReflection':modal('ПІДСУМОК УРОКУ','<p><strong>Дослідили:</strong> листя та воду.<br><strong>Побачили:</strong> зорі Тельця й Плеяди.<br><strong>Створили:</strong> модель сузір’я та відбиток листка.</p><p>Запитай дітей: «Чим корисним став урок? Яке відкриття здивувало найбільше?»</p>',[{text:'ДЯКУЮ ЗА РОБОТУ ✦',fn:()=>{}}]);break;}}
const paintFilters={orange:'grayscale(1) sepia(1) saturate(8) hue-rotate(315deg) brightness(.83) contrast(1.3)',green:'grayscale(1) sepia(1) saturate(5) hue-rotate(52deg) brightness(.85) contrast(1.35)',red:'grayscale(1) sepia(1) saturate(9) hue-rotate(308deg) brightness(.69) contrast(1.35)'};
function updateDigitalTelescope(){if(scene!==9||!state.skyFocus)return;const lens=document.querySelector('#digitalLens');if(lens){lens.style.setProperty('--sky-zoom',String(state.skyZoom));lens.style.setProperty('--sky-blur',String(Math.max(0,(68-state.skyFocusLevel)*.095).toFixed(1))+'px')}const z=document.querySelector('#zoomNumber');if(z)z.textContent=state.skyZoom.toFixed(2);document.querySelector('[data-act="skyZoomIn"]')?.toggleAttribute('disabled',state.skyZoom>=2.5);document.querySelector('[data-act="skyZoomOut"]')?.toggleAttribute('disabled',state.skyZoom<=1)}
function updateMicro(){if(scene!==5)return;const p=document.querySelector('#microPattern');if(!p)return;const g=state.microLeaf==='green';p.style.backgroundImage=`url('${file(g?'micro1':'micro3')}')`;p.style.backgroundPosition='center';p.style.filter=`blur(${Math.max(0,(72-state.focus)/17)}px) saturate(${g?'1.1':'1.0'})`;p.style.transform=`scale(${1+(state.mag-40)/550})`;setSharpMicroImage();document.querySelector('#microLabel').textContent=(g?'ЗЕЛЕНИЙ ЛИСТОК':'ОСІННІЙ ЛИСТОК')+' · '+state.mag+'×';document.querySelector('#microAdvice').textContent=state.focus<70?'Зображення ще нечітке. Посунь коліщатко фокусування праворуч.':'Тепер розглянь клітини! Чим відрізняються зелений та осінній листки?';document.querySelector('[data-act="microGreen"]')?.classList.toggle('selected',g);document.querySelector('[data-act="microYellow"]')?.classList.toggle('selected',!g)}
function setSharpMicroImage(){const p=document.querySelector('#microPattern');if(!p)return;const key=state.microLeaf==='green'?'microGreenLens':'microYellowLens';const snapshot=state.microLeaf;const im=new Image();im.onload=()=>{if(scene!==5||state.microLeaf!==snapshot)return;const pattern=document.querySelector('#microPattern');if(!pattern)return;pattern.style.backgroundImage=`url('${file(key)}')`;pattern.style.backgroundPosition='center';pattern.style.backgroundSize='contain';pattern.style.inset='0';};im.onerror=()=>{};im.src=file(key)}

let waterTimer=null;
function selectWater(k){if(state.waterBusy)return;state.waterSelection=k;state.waterPrediction=null;document.querySelectorAll('.water-choice').forEach(b=>b.classList.toggle('active',b.dataset.item===k));document.querySelector('#waterPrompt').textContent=`Як гадаєш, ${waterItems[k].label} плаватиме чи потоне? Спочатку вислови припущення.`;document.querySelector('#waterTip')?.classList.add('hidden');const obj=document.querySelector('#waterObject');obj.className='water-object';obj.removeAttribute('src');}
function showWaterSelection(){if(scene!==7)return;const k=state.waterSelection;if(!k)return;document.querySelector('#waterPrompt').textContent=`Обрано: ${waterItems[k].label}. Перед дослідом вислови припущення.`;document.querySelectorAll('.water-choice').forEach(b=>b.classList.toggle('active',b.dataset.item===k))}
function startWater(){const k=state.waterSelection;if(!k){toast('Спочатку обери предмет на лівій панелі.');return}if(state.waterBusy)return;const d=waterItems[k];modal('ПЕРЕД ДОСЛІДОМ',`<p>Що станеться, якщо опустити <strong>${esc(d.label)}</strong> у воду?</p><p>Спочатку діти висловлюють припущення. Познач їхній прогноз — <strong>а модель після цього покаже власний результат</strong>.</p>`,[{text:'ПЛАВАТИМЕ',fn:()=>{state.waterPrediction='float';dropWater(k,waterItems[k].typical)},className:'greenbtn'},{text:'ПОТОНЕ',fn:()=>{state.waterPrediction='sink';dropWater(k,waterItems[k].typical)},className:'goldbtn'}])}
function dropWater(k,result){if(scene!==7)return;state.waterBusy=true;state.waterPrediction=state.waterPrediction||null;const obj=document.querySelector('#waterObject');obj.src=file(k);obj.style.setProperty('--rest',result==='float'?'20%':'67%');obj.style.setProperty('--tilt',result==='float'?'-3deg':'12deg');obj.className='water-object entry'+((k==='leaf'||k==='stone')?' tiny':'');document.querySelector('#waterPrompt').textContent=`Спостерігаємо: ${waterItems[k].label} ${result==='float'?'залишається на поверхні':'опускається на дно'}…`;const s=document.querySelector('#splash');s.classList.remove('play');void s.offsetWidth;s.classList.add('play');clearTimeout(waterTimer);waterTimer=setTimeout(()=>{if(scene!==7)return;obj.className='water-object '+(result==='float'?'floating-result':'sunk-result')+((k==='leaf'||k==='stone')?' tiny':'');obj.style.removeProperty('--rest');state.waterBusy=false;state.waterResults[k]=result;const tip=document.querySelector('#waterTip');tip.textContent=`${result==='float'?'ПЛАВАЄ':'ТОНЕ'} — У НАШІЙ МОДЕЛІ. ${state.waterPrediction===result?'Припущення підтвердилося.':'Припущення не підтвердилося.'} ${waterItems[k].explain}`;tip.classList.remove('hidden');document.querySelector('#waterPrompt').textContent='Записуємо спостереження у журнал!';state.journalOpen=false;updateJournal();},1350)}
function resetWater(){clearTimeout(waterTimer);state.waterBusy=false;state.waterSelection=null;state.waterPrediction=null;state.waterResults={};state.journalOpen=false;setScene(7)}
function openWaterJournal(){const rows=['apple','pear','plum','leaf','stone'].map(k=>{const names={apple:'Яблуко',pear:'Груша',plum:'Слива',leaf:'Листочок',stone:'Камінчик'};const r=state.waterResults[k];return '<div class="journal-row"><span>'+names[k]+'</span><strong>'+(r?(r==='float'?'ПЛАВАЄ':'ТОНЕ'):'ЩЕ НЕ ДОСЛІДИЛИ')+'</strong></div>'}).join('');modal('ЖУРНАЛ НАШИХ ДОСЛІДЖЕНЬ','<div class="journal-rows">'+rows+'</div><p>'+journalConclusion()+'</p>',[{text:'ПОВЕРНУТИСЯ ДО ДОСЛІДУ',fn:()=>{}}])}
function updateJournal(){if(scene!==7)return;const count=Object.keys(state.waterResults).length;const counter=document.querySelector('#journalNumber');if(counter)counter.textContent=count+'/5';const actions=document.querySelector('#waterOps');if(actions&&count===5&&!actions.querySelector('[data-act="waterConclusion"]'))actions.insertAdjacentHTML('beforeend','<button class="greenbtn minorbtn" data-act="waterConclusion">✨ НАШЕ ВІДКРИТТЯ</button>')}
function modal(heading,content,buttons){document.querySelector('.modal-shade')?.remove();let sh=document.createElement('div');sh.className='modal-shade';const body=document.createElement('div');body.className='modal-body';const h=document.createElement('h2');h.textContent=heading;body.appendChild(h);const article=document.createElement('div');article.innerHTML=content;body.appendChild(article);const actions=document.createElement('div');actions.className='modal-actions';(buttons||[]).forEach(a=>{let b=document.createElement('button');b.className=(a.className||'mainbtn')+' minorbtn';b.textContent=a.text;b.onclick=()=>{clickSound();sh.remove();a.fn()};actions.appendChild(b)});let close=document.createElement('button');close.textContent='ЗАКРИТИ';close.className='minorbtn';close.onclick=()=>sh.remove();actions.appendChild(close);body.appendChild(actions);sh.appendChild(body);stage.appendChild(sh);sh.onclick=e=>{if(e.target===sh)sh.remove()}}
function stopAllMedia(){const v=stage.querySelector('video');if(v)v.pause()}
document.querySelector('#next').onclick=()=>change(1);document.querySelector('#back').onclick=()=>change(-1);document.querySelector('#home').onclick=()=>setScene(0);document.querySelector('#sound').onclick=()=>{soundOn=!soundOn;document.querySelector('#sound').textContent=soundOn?'♫ Звук: увімк.':'♫ Звук: вимк.';document.querySelector('#sound').classList.toggle('on',soundOn);clickSound()};document.querySelector('#fullscreen').onclick=()=>{if(!document.fullscreenElement){document.querySelector('#app').requestFullscreen?.().catch(()=>toast('Повноекранний режим недоступний у цьому браузері.'))}else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(document.querySelector('.modal-shade')){if(e.key==='Escape')document.querySelector('.modal-shade')?.remove();return}if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();change(1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();change(-1)}if(e.key==='Home'){e.preventDefault();setScene(0)}});
// Helpful debug-only media status: broken images are not silently substituted with irrelevant imagery.
stage.addEventListener('error',e=>{if(e.target?.tagName==='IMG')console.warn('Файл зображення не знайдено:',e.target.src);if(e.target?.tagName==='VIDEO')console.warn('Файл відео не знайдено:',e.target.src)},true);
setScene(0);
</script>
</body>
</html>
